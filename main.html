<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ЖК «Лучший»</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="header">
        <div class="container">
            <div class="logo">ЛСР</div>
            <div>ЖК «Лучший»</div>
        </div>
    </header>

    <main class="container">
        <h1>Квартиры в ЖК «Лучший»</h1>

        <div class="filters">
            <select id="rooms">
                <option value="all">Все комнаты</option>
                <option value="1">1 комната</option>
                <option value="2">2 комнаты</option>
                <option value="3">3 комнаты</option>
            </select>
            <input type="number" id="minPrice" placeholder="Цена от" value="0">
            <input type="number" id="maxPrice" placeholder="Цена до" value="30000000">
            <input type="number" id="minArea" placeholder="Площадь от" value="0">
            <input type="number" id="maxArea" placeholder="Площадь до" value="150">
            <button id="reset">Сброс</button>
        </div>

        <p>Найдено: <span id="count">0</span></p>
        <div id="list" class="grid"></div>
    </main>

    <div id="modal" class="modal">
        <div class="modal-inner">
            <span class="close">&times;</span>
            <h3>Бронирование</h3>
            <div id="modalInfo"></div>
            <form id="form">
                <input type="text" id="name" placeholder="Имя *" required>
                <input type="tel" id="phone" placeholder="Телефон *" required>
                <input type="email" id="email" placeholder="Email">
                <textarea id="comment" rows="2" placeholder="Комментарий"></textarea>
                <button type="submit">Отправить</button>
            </form>
        </div>
    </div>

    <div id="toast"></div>

    <script src="script.js"></script>
</body>
</html>
